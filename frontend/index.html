<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JARVIS</title>
<style>
  :root {
    --amber: #ff9a3c;
    --amber-soft: #ffb060;
    --amber-dim: rgba(255,154,60,.35);
    --line: rgba(255,154,60,.28);
    --bg: #05030a;
    --text: #ffd9b0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 45%, #140a02 0%, var(--bg) 68%, #000 100%);
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    color: var(--text);
  }
  #orb { position: fixed; inset: 0; display: block; cursor: pointer; }

  /* ---------- HUD: capa de adornos (no bloquea el ratón) ---------- */
  .hud-layer { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .frame {
    position: absolute; inset: 14px;
    border: 1px solid var(--line);
    clip-path: polygon(
      0 0, 46px 0, 46px 2px, calc(100% - 46px) 2px, calc(100% - 46px) 0, 100% 0,
      100% 46px, calc(100% - 2px) 46px, calc(100% - 2px) calc(100% - 46px),
      100% calc(100% - 46px), 100% 100%, calc(100% - 46px) 100%,
      calc(100% - 46px) calc(100% - 2px), 46px calc(100% - 2px), 46px 100%, 0 100%,
      0 calc(100% - 46px), 2px calc(100% - 46px), 2px 46px, 0 46px);
    box-shadow: 0 0 26px rgba(255,140,60,.12) inset;
  }
  .corner {
    position: absolute; width: 26px; height: 26px;
    border-color: var(--amber); border-style: solid; border-width: 0;
    opacity: .8;
  }
  .corner.tl { top: 14px; left: 14px; border-top-width: 2px; border-left-width: 2px; }
  .corner.tr { top: 14px; right: 14px; border-top-width: 2px; border-right-width: 2px; }
  .corner.bl { bottom: 14px; left: 14px; border-bottom-width: 2px; border-left-width: 2px; }
  .corner.br { bottom: 14px; right: 14px; border-bottom-width: 2px; border-right-width: 2px; }

  /* Barras superior e inferior */
  .topbar, .bottombar {
    position: absolute; left: 0; right: 0; height: 34px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--amber-soft);
  }
  .topbar { top: 16px; }
  .bottombar { bottom: 16px; }
  .topbar .seg, .bottombar .seg {
    display: flex; gap: 14px; align-items: center;
  }
  .tick {
    width: 2px; height: 12px; background: var(--amber-dim); display: inline-block;
  }
  .blip {
    width: 7px; height: 7px; border-radius: 50%; background: var(--amber);
    box-shadow: 0 0 10px var(--amber); display: inline-block;
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  /* Barras de nivel decorativas */
  .gauge { display: flex; gap: 3px; align-items: flex-end; height: 16px; }
  .gauge i {
    width: 3px; background: var(--amber-dim); height: 6px;
    animation: eq 1.2s ease-in-out infinite;
  }
  .gauge i:nth-child(2) { animation-delay: .15s; }
  .gauge i:nth-child(3) { animation-delay: .3s; }
  .gauge i:nth-child(4) { animation-delay: .45s; }
  .gauge i:nth-child(5) { animation-delay: .6s; }
  @keyframes eq { 0%,100% { height: 6px; } 50% { height: 15px; background: var(--amber); } }

  /* Paneles técnicos laterales */
  .side {
    position: absolute; top: 50%; transform: translateY(-50%);
    font-size: 10px; letter-spacing: 1.5px; color: var(--amber-dim);
    text-transform: uppercase; line-height: 1.9;
  }
  .side.left { left: 40px; }
  .side.right { right: 40px; text-align: right; }
  .side b { color: var(--amber-soft); font-weight: 500; }

  /* ---------- Centro: estado + respuesta ---------- */
  .center {
    position: fixed; inset: 0; z-index: 6; pointer-events: none;
    display: flex; flex-direction: column; align-items: center;
    justify-content: flex-end; padding-bottom: 120px; gap: 16px;
  }
  #status {
    font-size: 12px; letter-spacing: 6px; text-transform: uppercase;
    color: var(--amber); opacity: .9;
    text-shadow: 0 0 14px rgba(255,154,60,.7);
  }
  #reply {
    max-width: 680px; text-align: center; font-size: 16px; line-height: 1.6;
    color: var(--text); opacity: 0; transition: opacity .35s;
    text-shadow: 0 0 20px rgba(255,140,60,.4);
    font-family: -apple-system, "SF Pro Display", sans-serif;
  }
  #reply.show { opacity: 1; }

  /* ---------- Controles ---------- */
  .controls {
    position: fixed; left: 0; right: 0; bottom: 44px; z-index: 7;
    display: flex; align-items: center; justify-content: center; gap: 18px;
  }
  .ghost {
    padding: 8px 16px; border-radius: 20px; cursor: pointer;
    border: 1px solid var(--line); background: rgba(255,140,60,.05);
    color: var(--amber-soft); font-size: 12px; letter-spacing: 1px;
    font-family: inherit; text-transform: uppercase;
  }
  .ghost:hover { background: rgba(255,140,60,.16); }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 18px; text-align: center;
    font-size: 10px; letter-spacing: 2px; color: rgba(255,176,96,.4);
    text-transform: uppercase; z-index: 7;
  }
  #warn {
    position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
    background: rgba(120,40,0,.6); border: 1px solid var(--amber);
    color: var(--text); padding: 10px 16px; border-radius: 8px; font-size: 12px;
    display: none; max-width: 90vw; text-align: center; z-index: 20;
  }

  /* ---------- Ventana de permiso ---------- */
  #confirm {
    position: fixed; inset: 0; display: none; place-items: center;
    background: rgba(5,2,0,.75); backdrop-filter: blur(4px); z-index: 30;
  }
  #confirm.show { display: grid; }
  #confirm .box {
    max-width: 560px; width: 90vw; padding: 26px 28px;
    background: rgba(20,11,3,.97); border: 1px solid var(--amber);
    box-shadow: 0 0 44px rgba(255,140,60,.4); text-align: center;
    clip-path: polygon(0 14px, 14px 0, 100% 0, 100% calc(100% - 14px),
      calc(100% - 14px) 100%, 0 100%);
  }
  #confirm h2 { margin: 0 0 14px; font-size: 13px; letter-spacing: 4px;
    text-transform: uppercase; color: var(--amber); }
  #confirm pre {
    margin: 0 0 20px; padding: 14px; text-align: left;
    background: rgba(0,0,0,.55); border: 1px solid var(--line);
    color: var(--text); font-size: 13px; white-space: pre-wrap;
    word-break: break-word; max-height: 200px; overflow: auto;
    font-family: "SF Mono", Menlo, monospace;
  }
  #confirm .row { display: flex; gap: 12px; justify-content: center; }
  #confirm button {
    padding: 10px 26px; font-size: 13px; cursor: pointer; font-family: inherit;
    border: 1px solid var(--amber); letter-spacing: 1px; text-transform: uppercase;
  }
  #confirm .no { background: transparent; color: var(--amber-soft); }
  #confirm .yes { background: var(--amber); color: #140a02; font-weight: 700; }
  #confirm button:hover { filter: brightness(1.15); }

  @media (max-width: 720px) {
    .side { display: none; }
    .topbar, .bottombar { padding: 0 22px; font-size: 9px; }
  }
</style>
</head>
<body>
  <canvas id="orb"></canvas>

  <!-- Capa HUD decorativa -->
  <div class="hud-layer">
    <div class="frame"></div>
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>

    <div class="topbar">
      <div class="seg">
        <span class="blip"></span><span>JARVIS</span>
        <span class="tick"></span><span id="hud-clock">--:--:--</span>
      </div>
      <div class="seg">
        <span>NÚCLEO</span><span id="hud-state">EN ESPERA</span>
        <span class="gauge"><i></i><i></i><i></i><i></i><i></i></span>
      </div>
    </div>

    <div class="side left">
      <div>ENLACE <b id="hud-link">ESTABLE</b></div>
      <div>SEÑAL <b id="hud-signal">98%</b></div>
      <div>RUIDO <b id="hud-noise">0.00</b></div>
      <div>LATENCIA <b id="hud-lat">-- ms</b></div>
      <div>FRECUENCIA <b id="hud-freq">--</b></div>
      <div>CANAL <b>LOCAL</b></div>
    </div>

    <div class="side right">
      <div>VOZ <b id="hud-voice">—</b></div>
      <div>MICRÓFONO <b id="hud-mic">INACTIVO</b></div>
      <div>ENERGÍA <b id="hud-energy">0%</b></div>
      <div>CARGA <b id="hud-load">--</b></div>
      <div>BÚFER <b id="hud-buffer">--</b></div>
      <div>VERSIÓN <b>2.0</b></div>
    </div>

    <div class="bottombar">
      <div class="seg"><span id="hud-left">SISTEMAS OPERATIVOS</span></div>
      <div class="seg">
        <span class="tick"></span><span>◈</span>
        <span class="gauge"><i></i><i></i><i></i><i></i><i></i></span>
      </div>
    </div>
  </div>

  <!-- Centro -->
  <div class="center">
    <div id="status">en espera</div>
    <div id="reply"></div>
  </div>

  <!-- Controles -->
  <div class="controls">
    <button class="ghost" id="test" title="Probar sonido">🔊 probar voz</button>
  </div>
  <div id="hint">clic en el núcleo para hablar · pasa el ratón para interactuar</div>

  <div id="warn"></div>

  <div id="confirm">
    <div class="box">
      <h2>Permiso de JARVIS</h2>
      <pre id="confirm-detail"></pre>
      <div class="row">
        <button class="no" id="confirm-no">Cancelar</button>
        <button class="yes" id="confirm-yes">Autorizar</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { Orb } from "/static/orb.js";

    const orb = new Orb(document.getElementById("orb"));
    const statusEl = document.getElementById("status");
    const replyEl = document.getElementById("reply");
    const warn = document.getElementById("warn");

    function setStatus(s) {
      statusEl.textContent = s;
      document.getElementById("hud-state").textContent = s.toUpperCase();
    }
    function showReply(t) { replyEl.textContent = t; replyEl.classList.add("show"); }
    function showWarn(t) { warn.textContent = t; warn.style.display = "block"; }

    // ---------- Reloj y telemetría del HUD ----------
    setInterval(() => {
      const d = new Date();
      const p = (n) => String(n).padStart(2, "0");
      document.getElementById("hud-clock").textContent =
        `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }, 1000);
    document.getElementById("hud-voice").textContent = "ES-ES";

    // ---------- Datos del HUD que fluctúan ----------
    // Paseo aleatorio suave (movimiento browniano): los números se mueven poco a
    // poco dentro de un rango, de forma natural y creíble.
    const hud = {
      signal: { v: 98, min: 88, max: 100, step: 0.6 },
      noise: { v: 0.03, min: 0.01, max: 0.09, step: 0.02 },
      latency: { v: 24, min: 12, max: 60, step: 3 },
      freq: { v: 440, min: 420, max: 480, step: 4 },
      load: { v: 22, min: 10, max: 80, step: 3 },
      buffer: { v: 64, min: 32, max: 96, step: 4 },
    };
    const drift = (o) => {
      o.v += (Math.random() - 0.5) * o.step * 2;
      o.v = Math.max(o.min, Math.min(o.max, o.v));
      return o.v;
    };
    function fluctuaHUD() {
      document.getElementById("hud-signal").textContent = Math.round(drift(hud.signal)) + "%";
      document.getElementById("hud-noise").textContent = drift(hud.noise).toFixed(2);
      document.getElementById("hud-lat").textContent = Math.round(drift(hud.latency)) + " ms";
      document.getElementById("hud-freq").textContent = Math.round(drift(hud.freq)) + " Hz";
      document.getElementById("hud-load").textContent = Math.round(drift(hud.load)) + "%";
      document.getElementById("hud-buffer").textContent = Math.round(drift(hud.buffer)) + "%";
    }
    setInterval(fluctuaHUD, 700);
    fluctuaHUD();

    // El estado de enlace cambia de vez en cuando para dar sensación de vida.
    const enlaces = ["ESTABLE", "ESTABLE", "ESTABLE", "ÓPTIMO", "SINCRONIZANDO"];
    setInterval(() => {
      document.getElementById("hud-link").textContent =
        enlaces[Math.floor(Math.random() * enlaces.length)];
    }, 4200);

    // ---------- Audio: micro y voz -> nivel -> esfera ----------
    let audioCtx = null, micAnalyser = null, micData = null, micStream = null;
    let outAnalyser = null, outData = null;
    let level = 0;

    function ensureAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    // Conecta un <audio> al analizador para que la voz de JARVIS mueva la esfera.
    function attachOutput(audioEl) {
      try {
        const ctx = ensureAudioCtx();
        const src = ctx.createMediaElementSource(audioEl);
        outAnalyser = ctx.createAnalyser();
        outAnalyser.fftSize = 256;
        outData = new Uint8Array(outAnalyser.frequencyBinCount);
        src.connect(outAnalyser);
        outAnalyser.connect(ctx.destination);
      } catch (e) { /* si falla, la esfera usa solo el estado */ }
    }

    async function startMicAnalyser() {
      try {
        ensureAudioCtx();
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const src = audioCtx.createMediaStreamSource(micStream);
        micAnalyser = audioCtx.createAnalyser();
        micAnalyser.fftSize = 256;
        micData = new Uint8Array(micAnalyser.frequencyBinCount);
        src.connect(micAnalyser);
      } catch (e) { micAnalyser = null; }
    }

    function stopMicAnalyser() {
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      micAnalyser = null;
    }

    // Bucle único que calcula el nivel de audio y alimenta la esfera.
    (function audioLoop() {
      let v = 0;
      if (micAnalyser && micData) {
        micAnalyser.getByteFrequencyData(micData);
        let s = 0;
        for (let i = 0; i < micData.length; i++) s += micData[i];
        v = (s / micData.length) / 255;
      } else if (outAnalyser && outData) {
        outAnalyser.getByteFrequencyData(outData);
        let s = 0;
        for (let i = 0; i < outData.length; i++) s += outData[i];
        v = (s / outData.length) / 255;
      }
      level += (v - level) * 0.3;
      orb.setAudio(Math.min(1, level * 2.2));
      const pct = Math.round(Math.min(1, level * 2.2) * 100);
      document.getElementById("hud-energy").textContent = pct + "%";
      requestAnimationFrame(audioLoop);
    })();

    // ---------- Reconocimiento de voz (Chrome) ----------
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recog = null, listening = false;
    if (SR) {
      recog = new SR();
      recog.lang = "es-ES";
      recog.interimResults = true;
      recog.continuous = false;
      recog.onstart = () => {
        listening = true;
        setStatus("escuchando…"); orb.setState("listening");
        document.getElementById("hud-mic").textContent = "ACTIVO";
        startMicAnalyser();
      };
      recog.onend = () => {
        listening = false;
        setStatus("en espera"); orb.setState("idle");
        document.getElementById("hud-mic").textContent = "INACTIVO";
        stopMicAnalyser();
      };
      recog.onerror = (e) => { setStatus("error de micrófono: " + e.error); };
      recog.onresult = (e) => {
        let final = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) final += e.results[i][0].transcript;
        }
        if (final.trim()) send(final.trim());
      };
    } else {
      showWarn("Tu navegador no soporta micrófono. Abre JARVIS en Google Chrome.");
    }

    // El propio holograma es el botón: clic en el núcleo para hablar o parar.
    orb.onClick = () => {
      if (!recog) return;
      if (listening) recog.stop(); else recog.start();
    };

    // ---------- Botón de prueba de voz ----------
    document.getElementById("test").addEventListener("click", async () => {
      try {
        const r = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: "Di solo: probando la voz." }),
        });
        const d = await r.json();
        showReply(d.reply || "(sin respuesta)");
        if (d.audio) playAudio(d.audio, d.mime, d.reply);
        else showWarn("El servidor no generó audio. Revisa: bash doctor.sh");
      } catch (e) {
        showWarn("No se pudo probar la voz: " + e);
      }
    });

    // ---------- WebSocket ----------
    let ws = null;
    function connect() {
      ws = new WebSocket(`ws://${location.host}/ws`);
      ws.onopen = () => setStatus("en espera");
      ws.onclose = () => { setStatus("reconectando…"); setTimeout(connect, 1500); };
      ws.onerror = () => setStatus("sin conexión con JARVIS");
      ws.onmessage = (ev) => handle(JSON.parse(ev.data));
    }
    connect();

    function send(text) { showReply("Tú: " + text); ws.send(JSON.stringify({ message: text })); }

    // ---------- Audio del servidor -> reproducción ----------
    function b64ToBlob(b64, mime) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new Blob([bytes], { type: mime || "audio/mpeg" });
    }

    function browserSpeak(text) {
      if (!("speechSynthesis" in window)) { setStatus("en espera"); return; }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "es-ES";
      const es = speechSynthesis.getVoices().find(v => v.lang.startsWith("es"));
      if (es) u.voice = es;
      setStatus("hablando…"); orb.setState("speaking");
      u.onend = () => { orb.setState("idle"); setStatus("en espera"); };
      speechSynthesis.speak(u);
    }

    function playAudio(b64, mime, text) {
      if (!b64) { browserSpeak(text); return; }
      const url = URL.createObjectURL(b64ToBlob(b64, mime));
      const audio = new Audio(url);
      setStatus("hablando…"); orb.setState("speaking");
      const done = () => { orb.setState("idle"); setStatus("en espera"); URL.revokeObjectURL(url); };
      audio.onended = done;
      // Conecta la salida al analizador para que la voz mueva la esfera.
      if (!outAnalyser) attachOutput(audio);
      audio.play().then(() => {
        warn.style.display = "none";
      }).catch(() => {
        showWarn("🔊 Pulsa una vez en la página para activar el sonido.");
        browserSpeak(text);
      });
    }

    function handle(msg) {
      if (msg.type === "thinking") { setStatus("pensando…"); orb.setState("thinking"); return; }
      if (msg.type === "confirm") { askConfirm(msg); return; }
      if (msg.reply) { showReply(msg.reply); setStatus("pensando…"); orb.setState("thinking"); }
      if (msg.reply) playAudio(msg.audio, msg.mime, msg.reply);
      else setStatus("en espera");
    }

    // ---------- Permiso (de una en una) ----------
    const confirmBox = document.getElementById("confirm");
    const confirmDetail = document.getElementById("confirm-detail");
    let confirmOpen = false;

    function askConfirm(msg) {
      if (confirmOpen) return;
      confirmOpen = true;
      const detalle = msg.args && msg.args.command ? msg.args.command
        : JSON.stringify(msg.args || {}, null, 2);
      const accion = { write_file: "escribir un archivo",
                       run_shell: "ejecutar un comando" }[msg.tool] || msg.tool;
      confirmDetail.textContent = `Quiere ${accion}:\n\n${detalle}`;
      confirmBox.classList.add("show");
      setStatus("esperando tu permiso");

      const responder = (ok) => {
        confirmBox.classList.remove("show");
        confirmOpen = false;
        ws.send(JSON.stringify({ confirm: ok }));
        setStatus(ok ? "autorizado" : "cancelado");
      };
      document.getElementById("confirm-yes").onclick = () => responder(true);
      document.getElementById("confirm-no").onclick = () => responder(false);
    }

    // ---------- Estado inicial ----------
    fetch("/api/health").then(r => r.json()).then(h => {
      if (!h.brain_ok) showWarn("⚠️ El cerebro no responde. Ejecuta: bash setup-brain.sh");
    }).catch(() => {});
  </script>
</body>
</html>
