<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JARVIS</title>
<style>
  :root {
    --orange: #ff9a3c;
    --orange-soft: #ffb060;
    --bg: #0a0603;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 45%, #1a0f05 0%, var(--bg) 70%);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    color: var(--orange-soft);
  }
  #orb { position: fixed; inset: 0; display: block; cursor: pointer; }

  .hud {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center;
    gap: 14px; padding: 24px; pointer-events: none;
  }
  #status {
    font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--orange); opacity: .85; min-height: 16px;
    text-shadow: 0 0 12px rgba(255,154,60,.6);
  }
  #reply {
    max-width: 720px; text-align: center; font-size: 17px; line-height: 1.5;
    color: #ffd9b0; opacity: 0; transition: opacity .35s; min-height: 24px;
    text-shadow: 0 0 18px rgba(255,140,60,.35);
  }
  #reply.show { opacity: 1; }

  #mic {
    pointer-events: auto; width: 74px; height: 74px; border-radius: 50%;
    border: 2px solid var(--orange); background: rgba(255,140,60,.08);
    color: var(--orange); font-size: 30px; cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 0 0 0 rgba(255,154,60,.5), 0 0 28px rgba(255,140,60,.35) inset;
    transition: transform .15s, box-shadow .25s, background .25s;
  }
  #mic:hover { transform: scale(1.08); background: rgba(255,140,60,.16);
    box-shadow: 0 0 34px rgba(255,154,60,.55), 0 0 28px rgba(255,140,60,.4) inset; }
  #mic.listening {
    background: rgba(255,154,60,.3);
    animation: pulse 1.1s ease-in-out infinite;
  }
  #test {
    pointer-events: auto; padding: 8px 16px; border-radius: 20px;
    border: 1px solid var(--orange); background: rgba(255,140,60,.08);
    color: var(--orange-soft); font-size: 13px; cursor: pointer;
  }
  #test:hover { background: rgba(255,140,60,.18); }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(255,154,60,.55), 0 0 30px rgba(255,140,60,.5) inset; }
    50% { box-shadow: 0 0 0 22px rgba(255,154,60,0), 0 0 30px rgba(255,140,60,.5) inset; }
  }
  #hint {
    font-size: 12px; letter-spacing: 1px; color: rgba(255,176,96,.5);
    pointer-events: none;
  }
  #warn {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(120,40,0,.55); border: 1px solid var(--orange);
    color: #ffd9b0; padding: 10px 16px; border-radius: 10px; font-size: 13px;
    display: none; max-width: 90vw; text-align: center;
  }
  #confirm {
    position: fixed; inset: 0; display: none; place-items: center;
    background: rgba(5,2,0,.72); backdrop-filter: blur(3px); z-index: 10;
  }
  #confirm.show { display: grid; }
  #confirm .box {
    max-width: 560px; width: 90vw; padding: 26px 28px; border-radius: 16px;
    background: rgba(26,15,5,.96); border: 1px solid var(--orange);
    box-shadow: 0 0 40px rgba(255,140,60,.35); text-align: center;
  }
  #confirm h2 { margin: 0 0 14px; font-size: 15px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--orange); }
  #confirm pre {
    margin: 0 0 20px; padding: 14px; border-radius: 10px; text-align: left;
    background: rgba(0,0,0,.5); border: 1px solid rgba(255,140,60,.35);
    color: #ffd9b0; font-size: 13px; white-space: pre-wrap; word-break: break-word;
    max-height: 200px; overflow: auto;
  }
  #confirm .row { display: flex; gap: 12px; justify-content: center; }
  #confirm button {
    padding: 10px 26px; border-radius: 22px; font-size: 14px; cursor: pointer;
    border: 1px solid var(--orange);
  }
  #confirm .no { background: transparent; color: var(--orange-soft); }
  #confirm .yes { background: var(--orange); color: #1a0f05; font-weight: 600; }
  #confirm button:hover { filter: brightness(1.15); }
</style>
</head>
<body>
  <canvas id="orb"></canvas>

  <div id="warn"></div>

  <div id="confirm">
    <div class="box">
      <h2>Permiso de JARVIS</h2>
      <pre id="confirm-detail"></pre>
      <div class="row">
        <button class="no" id="confirm-no">Cancelar</button>
        <button class="yes" id="confirm-yes">Autorizar</button>
      </div>
    </div>
  </div>

  <div class="hud">
    <div id="status">en espera</div>
    <div id="reply"></div>
    <button id="mic" title="Hablar">🎙️</button>
    <div id="hint">pasa el ratón sobre el orbe · clic en el orbe para un pulso</div>
    <button id="test" title="Probar sonido">🔊 probar voz</button>
  </div>

  <script type="module">
    import { Orb } from "/static/orb.js";

    const orb = new Orb(document.getElementById("orb"));
    const statusEl = document.getElementById("status");
    const replyEl = document.getElementById("reply");
    const mic = document.getElementById("mic");
    const warn = document.getElementById("warn");

    function setStatus(s) { statusEl.textContent = s; }
    function showReply(t) { replyEl.textContent = t; replyEl.classList.add("show"); }
    function showWarn(t) { warn.textContent = t; warn.style.display = "block"; }

    // --- Reconocimiento de voz (Chrome) ---
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recog = null, listening = false;
    if (SR) {
      recog = new SR();
      recog.lang = "es-ES";
      recog.interimResults = true;
      recog.continuous = false;
      recog.onstart = () => { listening = true; mic.classList.add("listening"); setStatus("escuchando…"); };
      recog.onend = () => { listening = false; mic.classList.remove("listening"); setStatus("en espera"); };
      recog.onerror = (e) => { setStatus("error de micrófono: " + e.error); };
      recog.onresult = (e) => {
        let final = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) final += e.results[i][0].transcript;
        }
        if (final.trim()) send(final.trim());
      };
    } else {
      showWarn("Tu navegador no soporta micrófono. Abre JARVIS en Google Chrome.");
    }

    mic.addEventListener("click", () => {
      if (!recog) return;
      if (listening) recog.stop(); else recog.start();
    });

    // Botón de prueba: pide audio al servidor y lo reproduce. Sirve para
    // comprobar si el problema es de sonido o de la respuesta.
    document.getElementById("test").addEventListener("click", async () => {
      try {
        const r = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: "Di solo: probando la voz." }),
        });
        const d = await r.json();
        showReply(d.reply || "(sin respuesta)");
        if (d.audio) playAudio(d.audio, d.mime, d.reply);
        else showWarn("El servidor no generó audio. Revisa: bash doctor.sh");
      } catch (e) {
        showWarn("No se pudo probar la voz: " + e);
      }
    });

    // --- Envío al servidor por WebSocket ---
    let ws = null;
    function connect() {
      ws = new WebSocket(`ws://${location.host}/ws`);
      ws.onopen = () => setStatus("en espera");
      ws.onclose = () => { setStatus("reconectando…"); setTimeout(connect, 1500); };
      ws.onerror = () => setStatus("sin conexión con JARVIS");
      ws.onmessage = (ev) => handle(JSON.parse(ev.data));
    }
    connect();

    function send(text) { showReply("Tú: " + text); ws.send(JSON.stringify({ message: text })); }

    // Reproduce el audio del servidor. Si el navegador lo bloquea, usa la voz
    // del propio navegador (speechSynthesis) para no quedarse mudo.
    function b64ToBlob(b64, mime) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new Blob([bytes], { type: mime || "audio/mpeg" });
    }

    function browserSpeak(text) {
      if (!("speechSynthesis" in window)) { setStatus("en espera"); return; }
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "es-ES";
      const es = speechSynthesis.getVoices().find(v => v.lang.startsWith("es"));
      if (es) u.voice = es;
      setStatus("hablando…"); orb.speaking(true);
      u.onend = () => { orb.speaking(false); setStatus("en espera"); };
      speechSynthesis.speak(u);
    }

    function playAudio(b64, mime, text) {
      if (!b64) { browserSpeak(text); return; }
      const url = URL.createObjectURL(b64ToBlob(b64, mime));
      const audio = new Audio(url);
      setStatus("hablando…"); orb.speaking(true);
      const done = () => { orb.speaking(false); setStatus("en espera"); URL.revokeObjectURL(url); };
      audio.onended = done;
      audio.play().then(() => {
        warn.style.display = "none";
      }).catch(() => {
        // Autoplay bloqueado: mostramos un aviso y usamos la voz del navegador.
        showWarn("🔊 Pulsa una vez en la página para activar el sonido.");
        browserSpeak(text);
      });
    }

    function handle(msg) {
      if (msg.type === "thinking") { setStatus("pensando…"); orb.speaking(false); return; }
      if (msg.type === "confirm") { askConfirm(msg); return; }
      if (msg.reply) { showReply(msg.reply); setStatus("pensando…"); orb.speaking(false); }
      if (msg.reply) playAudio(msg.audio, msg.mime, msg.reply);
      else setStatus("en espera");
    }

    // Pide permiso al usuario antes de ejecutar una acción, de una en una,
    // en una ventana propia de JARVIS con el comando exacto.
    const confirmBox = document.getElementById("confirm");
    const confirmDetail = document.getElementById("confirm-detail");
    let confirmOpen = false;

    function askConfirm(msg) {
      if (confirmOpen) return;          // ya hay una petición en pantalla
      confirmOpen = true;
      const detalle = msg.args && msg.args.command ? msg.args.command
        : JSON.stringify(msg.args || {}, null, 2);
      const accion = { write_file: "escribir un archivo",
                       run_shell: "ejecutar un comando" }[msg.tool] || msg.tool;
      confirmDetail.textContent = `Quiere ${accion}:\n\n${detalle}`;
      confirmBox.classList.add("show");
      setStatus("esperando tu permiso");

      const responder = (ok) => {
        confirmBox.classList.remove("show");
        confirmOpen = false;
        ws.send(JSON.stringify({ confirm: ok }));
        setStatus(ok ? "autorizado" : "cancelado");
      };
      document.getElementById("confirm-yes").onclick = () => responder(true);
      document.getElementById("confirm-no").onclick = () => responder(false);
    }

    // Estado inicial: ¿tiene cerebro?
    fetch("/api/health").then(r => r.json()).then(h => {
      if (!h.brain_ok) showWarn("⚠️ El cerebro no responde. Ejecuta: bash setup-brain.sh");
    }).catch(() => {});
  </script>
</body>
</html>
